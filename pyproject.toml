[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppfl-iot-zeroday"
version = "0.1.0"
description = "Privacy-preserving federated learning framework for zero-day threat detection in IoT networks using anomaly detection, differential privacy, and secure aggregation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vyom" }]
keywords = ["federated-learning", "differential-privacy", "secure-aggregation", "iot", "intrusion-detection", "anomaly-detection", "autoencoder"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.0",
    "opacus>=1.4",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "joblib>=1.3",
    "streamlit>=1.40",
    "plotly>=5.20",
]

[project.optional-dependencies]
flower = ["flwr>=1.10"]
dev = ["pytest>=7.4", "nbformat>=5.9"]

[project.scripts]
ppfl-prepare = "ppfl.cli.prepare_data:main"
ppfl-clients = "ppfl.cli.create_clients:main"
ppfl-train = "ppfl.cli.train:main"
ppfl-evaluate = "ppfl.cli.evaluate:main"
ppfl-run-experiments = "ppfl.cli.run_experiments:main"
ppfl-report = "ppfl.cli.generate_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:Secure RNG turned off:UserWarning",
    "ignore:Optimal order is the largest alpha:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
